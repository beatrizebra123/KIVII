<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIVII — Coming Soon</title>
  <meta
    name="description"
    content="KIVII is under construction. Coming very very soon."
  />
  <link rel="icon" type="image/png" href="assets/kivii-mascot.png" />

  <style>
    :root {
      --brown: #311A16;
      --lime: #CCFF00;
      --cream: #FFF8E8;
      --pink: #FF9FCB;
      --line: rgba(204, 255, 0, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(204,255,0,0.08), transparent 24rem),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.04), transparent 24rem),
        var(--brown);
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page {
      width: min(920px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      position: relative;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: -30px;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
    }

    .logo {
      width: clamp(110px, 12vw, 170px);
      height: auto;
      display: block;
      margin-bottom: 10px;
    }

    .screen {
      width: min(100%, 760px);
      border: 2px solid var(--line);
      padding: clamp(26px, 4vw, 42px);
      background: rgba(0, 0, 0, 0.08);
      box-shadow: inset 0 0 0 1px rgba(204,255,0,0.08);
    }

    .mini-label {
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 248, 232, 0.82);
      margin-bottom: 16px;
    }

    h1 {
      color: var(--lime);
      font-size: clamp(46px, 9vw, 96px);
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .soon {
      font-size: clamp(22px, 3.2vw, 42px);
      line-height: 0.98;
      letter-spacing: -0.04em;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .soon .pink {
      color: var(--pink);
    }

    .loading-block {
      width: min(420px, 100%);
      margin: 0 auto 14px;
    }

    .loading-text {
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 248, 232, 0.78);
      margin-bottom: 8px;
    }

    .loading-bar {
      width: 100%;
      height: 22px;
      border: 2px solid var(--lime);
      padding: 3px;
      background: rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .loading-fill {
      height: 100%;
      width: 48%;
      background:
        repeating-linear-gradient(
          90deg,
          var(--lime) 0 12px,
          rgba(49, 26, 22, 0.7) 12px 16px
        );
      animation: loadingMove 2s linear infinite;
    }

    .sub {
      font-size: clamp(14px, 1.4vw, 18px);
      color: rgba(255, 248, 232, 0.78);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .mascot {
      width: clamp(110px, 16vw, 170px);
      height: auto;
      display: block;
      margin-top: 6px;
      animation: float 3.8s ease-in-out infinite;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.22));
    }

    .instagram {
      margin-top: 6px;
      display: inline-block;
      text-decoration: none;
      color: var(--lime);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(204,255,0,0.45);
      padding-bottom: 2px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .instagram:hover {
      opacity: 0.8;
      transform: translateY(-1px);
    }

    @keyframes loadingMove {
      0% {
        transform: translateX(-30%);
      }
      100% {
        transform: translateX(110%);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      .screen {
        padding: 24px 18px;
      }

      h1 {
        font-size: clamp(42px, 14vw, 72px);
      }

      .soon {
        font-size: clamp(20px, 7vw, 32px);
      }

      .loading-bar {
        height: 20px;
      }

      .mini-label,
      .loading-text {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-fill,
      .mascot {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img
      class="logo"
      src="assets/kivii-logo.png"
      alt="KIVII"
    />

    <section class="screen">
      <div class="mini-label">CURRENTLY COOKING</div>

      <h1>UNDER<br>CONSTRUCTION</h1>

      <p class="soon">
        COMING VERY, VERY SOON<span class="pink">!</span>
      </p>

      <div class="loading-block">
        <div class="loading-text">Loading...</div>
        <div class="loading-bar">
          <div class="loading-fill"></div>
        </div>
      </div>

      <p class="sub">STAY TOONED</p>
    </section>

    <img
      class="mascot"
      src="assets/kivii-mascot.png"
      alt="KIVII mascot"
    />

    <a
      class="instagram"
      href="https://www.instagram.com/kivii.app/"
      target="_blank"
      rel="noopener noreferrer"
    >
      @kivii.app
    </a>
  </main>
</body>
</html>
