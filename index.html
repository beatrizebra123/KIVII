<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KIVII — Coming Soon</title>
  <meta
    name="description"
    content="The solution for freelancers is coming very, very soon."
  />

  <link rel="icon" type="image/png" href="assets/kivii-mascot.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;1,500;1,600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --brown: #311A16;
      --lime: #CCFF00;
      --cream: #F8F5F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      background: var(--brown);
      color: var(--lime);
      font-family: "Montserrat", Arial, sans-serif;
    }

    .page {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 24px;
    }

    .content {
      width: min(1040px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .intro {
      max-width: 980px;
      margin-bottom: 92px;
      font-size: clamp(16px, 1.45vw, 20px);
      line-height: 1.5;
      font-weight: 500;
      font-style: italic;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .logo {
      width: clamp(62px, 6.6vw, 88px);
      height: auto;
      display: block;
      margin-bottom: 42px;
    }

    .loading-wrap {
      width: min(245px, 72vw);
      margin-bottom: 66px;
    }

    .loading-bar {
      position: relative;
      width: 100%;
      height: 30px;
      border: 4px solid var(--lime);
      border-radius: 999px;
      overflow: hidden;
      background: var(--cream);
    }

    .loading-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 56%;
      background: var(--lime);
      animation: loadingPulse 2.2s ease-in-out infinite;
    }

    .loading-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 15px;
      z-index: 2;
      color: var(--brown);
      font-size: 10px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
      pointer-events: none;
    }

    .date {
      margin-bottom: 74px;
      font-size: clamp(17px, 1.65vw, 21px);
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .mascot-wrap {
      position: relative;
      width: clamp(42px, 4.2vw, 56px);
      aspect-ratio: 1 / 1;
      margin-bottom: 50px;
      animation: tinyFloat 3.5s ease-in-out infinite;
    }

    .mascot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: opacity 0.2s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .mascot-default {
      opacity: 1;
    }

    .mascot-hover {
      opacity: 0;
    }

    .mascot-wrap:hover .mascot-default {
      opacity: 0;
    }

    .mascot-wrap:hover .mascot-hover {
      opacity: 1;
    }

    .instagram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--lime);
      color: var(--brown);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .instagram:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    @keyframes loadingPulse {
      0% {
        width: 42%;
      }
      50% {
        width: 66%;
      }
      100% {
        width: 42%;
      }
    }

    @keyframes tinyFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @media (max-width: 760px) {
      .page {
        padding: 44px 20px;
      }

      .intro {
        white-space: normal;
        max-width: 440px;
        margin-bottom: 66px;
      }

      .logo {
        margin-bottom: 34px;
      }

      .loading-wrap {
        margin-bottom: 50px;
      }

      .date {
        margin-bottom: 56px;
      }

      .mascot-wrap {
        margin-bottom: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-fill,
      .mascot-wrap {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content">
      <p class="intro">
        The solution for freelancers is coming very, very soon. You might want to get ready.
      </p>

      <img
        class="logo"
        src="assets/kivii-logo.png"
        alt="KIVII"
      />

      <div class="loading-wrap">
        <div class="loading-bar">
          <div class="loading-fill"></div>
          <div class="loading-text">Under construction...</div>
        </div>
      </div>

      <p class="date">Early 2027</p>

      <div class="mascot-wrap">
        <img
          class="mascot mascot-default"
          src="assets/kivii-mascot.png"
          alt="KIVII mascot"
        />

        <img
          class="mascot mascot-hover"
          src="assets/kivii-mascot-hover.png"
          alt="KIVII mascot smiling"
        />
      </div>

      <a
        class="instagram"
        href="https://www.instagram.com/kivii.app/"
        target="_blank"
        rel="noopener noreferrer"
      >
        @KIVII.APP
      </a>
    </section>
  </main>
</body>
</html>
